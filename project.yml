name: Colorvia
options:
  bundleIdPrefix: io.tmkch
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.7.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 7GU925RQ99
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 5
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Colorvia
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  Colorvia:
    type: application
    platform: iOS
    sources:
      - path: Colorvia
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Colorvia/Colorvia.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: io.tmkch.colorvia
        # Version 1 is intentionally iPhone-only. iPad support will be enabled
        # after its layouts, rotations, and App Store screenshots are complete.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_FILE: Colorvia/Info.plist
    preBuildScripts:
      - name: Validate external service configuration
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ] && [ "$ADS_ENABLED" = "YES" ]; then
            if [ -z "$ADMOB_APP_ID" ] || [ -z "$ADMOB_BANNER_AD_UNIT_ID" ]; then
              echo "error: ADS_ENABLED=YES requires ADMOB_APP_ID and ADMOB_BANNER_AD_UNIT_ID"
              exit 1
            fi
          fi
    scheme:
      testTargets:
        - ColorviaTests
  ColorviaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ColorviaTests
    dependencies:
      - target: Colorvia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.tmkch.colorvia.tests
